<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Alunos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <!-- Contêiner onde o header será carregado -->
    <div id="header-container"></div>

    <div class="container mt-5">
        <h2 class="mb-4">Cadastro de Alunos</h2>
        <!-- Formulário de Cadastro -->
        <form id="alunoForm" class="row g-3 mb-4">
            <div class="col-md-6">
                <label for="matricula" class="form-label">Matrícula</label>
                <input type="text" class="form-control" id="matricula" name="matricula" required>
            </div>
            <div class="col-md-6">
                <label for="nome" class="form-label">Nome</label>
                <input type="text" class="form-control" id="nome" name="nome" required>
            </div>
            <div class="col-md-6">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" required>
            </div>
            <div class="col-md-6">
                <label for="senha" class="form-label">Senha</label>
                <input type="password" class="form-control" id="senha" name="senha" required>
            </div>
            <div class="col-md-6">
                <label for="curso" class="form-label">Curso</label>
                <input type="text" class="form-control" id="curso" name="curso" required>
            </div>
            <div class="col-md-3">
                <label for="turma" class="form-label">Turma</label>
                <input type="text" class="form-control" id="turma" name="turma" required>
            </div>
            <div class="col-md-3">
                <label for="periodo" class="form-label">Período</label>
                <input type="number" class="form-control" id="periodo" name="periodo" required>
            </div>
            <div class="col-md-3">
                <label for="semestre" class="form-label">Semestre</label>
                <input type="number" class="form-control" id="semestre" name="semestre" required>
            </div>
            <div class="col-md-12">
                <button type="submit" class="btn btn-primary">Cadastrar</button>
            </div>
        </form>

        <!-- Filtro e Tabela -->
        <h3 class="mb-3">Lista de Alunos</h3>
        <div class="d-flex mb-3">
            <input type="text" id="filtro" class="form-control me-2" placeholder="Filtrar por Matrícula">
            <button id="buscar" class="btn btn-secondary me-2">Buscar</button>
            <button id="limparBusca" class="btn btn-outline-secondary">Limpar Busca</button>
        </div>
        <table id="alunosTable" class="table table-bordered table-striped">
            <thead class="table-dark">
                <tr>
                    <th>Matrícula</th>
                    <th>Nome</th>
                    <th>Email</th>
                    <th>Curso</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <!-- Popup de edição -->
    <div id="popup" class="modal fade" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Editar Aluno</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="popupForm">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="matriculaPopup" class="form-label">Matrícula</label>
                            <input type="text" class="form-control" id="matriculaPopup" name="matricula" disabled>
                        </div>
                        <div class="mb-3">
                            <label for="nomePopup" class="form-label">Nome</label>
                            <input type="text" class="form-control" id="nomePopup" name="nome">
                        </div>
                        <div class="mb-3">
                            <label for="emailPopup" class="form-label">Email</label>
                            <input type="email" class="form-control" id="emailPopup" name="email">
                        </div>
                        <div class="mb-3">
                            <label for="senhaPopup" class="form-label">Senha</label>
                            <input type="password" class="form-control" id="senhaPopup" name="senha">
                        </div>
                        <div class="mb-3">
                            <label for="cursoPopup" class="form-label">Curso</label>
                            <input type="text" class="form-control" id="cursoPopup" name="curso">
                        </div>
                        <div class="mb-3">
                            <label for="turmaPopup" class="form-label">Turma</label>
                            <input type="text" class="form-control" id="turmaPopup" name="turma">
                        </div>
                        <div class="mb-3">
                            <label for="periodoPopup" class="form-label">Período</label>
                            <input type="number" class="form-control" id="periodoPopup" name="periodo">
                        </div>
                        <div class="mb-3">
                            <label for="semestrePopup" class="form-label">Semestre</label>
                            <input type="number" class="form-control" id="semestrePopup" name="semestre">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Atualizar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div id="footer-container" class="text-center mt-5">
        <p>© 2024 Gerenciador de TG</p>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Script do CRUD -->
    <script src="../assets/js/alunos.js"></script>
</body>

</html>

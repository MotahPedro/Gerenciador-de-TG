<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Trabalhos de Graduação</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>

<body class="bg-light">

    <!-- Contêiner onde o header será carregado -->
    <div id="header-container" class="mb-4"></div>

    <div class="container">
        <h2 class="my-4 text-center">Cadastro de Orientadores</h2>
        <form id="professorForm" class="mb-5">
            <div class="form-group">
                <label for="cpf">CPF</label>
                <input type="text" class="form-control" name="cpf" id="cpf" required>
            </div>
            <div class="form-group">
                <label for="nome">Nome</label>
                <input type="text" class="form-control" name="nome" id="nome" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" class="form-control" name="email" id="email" required>
            </div>
            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" class="form-control" name="senha" id="senha" required>
            </div>
            <div class="form-group">
                <label for="linhasOrientacao">Linhas de Orientação</label>
                <input type="text" class="form-control" name="linhasOrientacao" id="linhasOrientacao" required>
            </div>
            <div class="form-group">
                <label for="quantidadeInstituicoes">Quantidade de Instituições</label>
                <input type="number" class="form-control" name="quantidadeInstituicoes" id="quantidadeInstituicoes">
            </div>
            <div class="form-group">
                <label for="cursosAtuacao">Cursos de Atuação</label>
                <input type="text" class="form-control" name="cursosAtuacao" id="cursosAtuacao" required>
            </div>
            <div class="form-group">
                <label for="quantidadeAlunos">Quantidade de Alunos</label>
                <input type="number" class="form-control" name="quantidadeAlunos" id="quantidadeAlunos">
            </div>
            <div class="form-group">
                <label for="alunosOrientados">Alunos Orientados</label>
                <input type="text" class="form-control" name="alunosOrientados" id="alunosOrientados" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Cadastrar</button>
        </form>

        <h3 class="mb-3">Lista de Orientadores</h3>
        <div class="form-inline mb-3">
            <input type="text" id="filtro" class="form-control mr-2" placeholder="Filtrar por CPF">
            <button id="buscar" class="btn btn-outline-primary mr-2">Buscar</button>
            <button id="limparBusca" class="btn btn-outline-secondary">Limpar Busca</button>
        </div>

        <table class="table table-striped" id="professoresTable">
            <thead class="thead-dark">
                <tr>
                    <th>CPF</th>
                    <th>Nome</th>
                    <th>Email</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <!-- Popup de edição -->
    <div id="popup" class="modal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Editar Orientador</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <form id="popupForm">
                    <div class="modal-body">
                        <div class="form-group">
                            <label for="cpfPopup">CPF</label>
                            <input type="text" class="form-control" name="cpf" id="cpfPopup" disabled>
                        </div>
                        <div class="form-group">
                            <label for="nomePopup">Nome</label>
                            <input type="text" class="form-control" name="nome" id="nomePopup">
                        </div>
                        <div class="form-group">
                            <label for="emailPopup">Email</label>
                            <input type="email" class="form-control" name="email" id="emailPopup">
                        </div>
                        <div class="form-group">
                            <label for="senhaPopup">Senha</label>
                            <input type="password" class="form-control" name="senha" id="senhaPopup">
                        </div>
                        <div class="form-group">
                            <label for="linhasOrientacaoPopup">Linhas de Orientação</label>
                            <input type="text" class="form-control" name="linhasOrientacao" id="linhasOrientacaoPopup" required>
                        </div>
                        <div class="form-group">
                            <label for="quantidadeInstituicoesPopup">Quantidade de Instituições</label>
                            <input type="number" class="form-control" name="quantidadeInstituicoes" id="quantidadeInstituicoesPopup">
                        </div>
                        <div class="form-group">
                            <label for="cursosAtuacaoPopup">Cursos de Atuação</label>
                            <input type="text" class="form-control" name="cursosAtuacao" id="cursosAtuacaoPopup" required>
                        </div>
                        <div class="form-group">
                            <label for="quantidadeAlunosPopup">Quantidade de Alunos</label>
                            <input type="number" class="form-control" name="quantidadeAlunos" id="quantidadeAlunosPopup">
                        </div>
                        <div class="form-group">
                            <label for="alunosOrientadosPopup">Alunos Orientados</label>
                            <input type="text" class="form-control" name="alunosOrientados" id="alunosOrientadosPopup" required>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" id="cancelarButton" data-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary" id="atualizarButton">Atualizar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <footer class="text-center mt-4">
        <p>© 2024 Gerenciador de TG</p>
    </footer>

    <!-- Script para importar o header -->
    <script>
        fetch('../components/header.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('header-container').innerHTML = data;
            })
            .catch(error => console.error('Erro ao carregar o header:', error));
    </script>

    <!-- Script do arquivo JS da página -->
    <script src="../assets/js/professores.js"></script>
</body>

</html>

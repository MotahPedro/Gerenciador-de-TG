<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Trabalhos de Graduação</title>
    <link rel="stylesheet" href="../assets/css/professores.css">
</head>

<body>

    <!-- Contêiner onde o header será carregado -->
    <div id="header-container"></div>

    <div>
        <h2>Cadastro de Orientadores</h2>
        <form id="professorForm">
            <label for="cpf">CPF</label>
            <input type="text" name="cpf" id="cpf" required>

            <label for="nome">Nome</label>
            <input type="text" name="nome" id="nome" required>

            <label for="email">Email</label>
            <input type="email" name="email" id="email" required>

            <label for="senha">Senha</label>
            <input type="password" name="senha" id="senha" required>

            <label for="linhasOrientacao">Linhas de Orientação</label>
            <input type="text" name="linhasOrientacao" id="linhasOrientacao">

            <label for="quantidadeInstituicoes">Quantidade de Instituições</label>
            <input type="number" name="quantidadeInstituicoes" id="quantidadeInstituicoes">

            <label for="cursosAtuacao">Cursos de Atuação</label>
            <input type="text" name="cursosAtuacao" id="cursosAtuacao">

            <label for="quantidadeAlunos">Quantidade de Alunos</label>
            <input type="number" name="quantidadeAlunos" id="quantidadeAlunos">

            <label for="alunosOrientados">Alunos Orientados</label>
            <input type="text" name="alunosOrientados" id="alunosOrientados">

            <button type="submit">Cadastrar</button>
        </form>

        <h3>Lista de Orientadores</h3>
        <input type="text" id="filtro" placeholder="Filtrar por CPF">
        <button id="buscar">Buscar</button>
        <button id="limparBusca">Limpar Busca</button>

        <table id="professoresTable">
            <thead>
                <tr>
                    <th>CPF</th>
                    <th>Nome</th>
                    <th>Email</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <!-- Popup de edição -->
    <div id="popup">
        <div class="popup-content">
            <form id="popupForm">
                <label for="cpfPopup">CPF</label>
                <input type="text" name="cpf" id="cpfPopup" disabled>

                <label for="nomePopup">Nome</label>
                <input type="text" name="nome" id="nomePopup">

                <label for="emailPopup">Email</label>
                <input type="email" name="email" id="emailPopup">

                <label for="senhaPopup">Senha</label>
                <input type="password" name="senha" id="senhaPopup">

                <label for="linhasOrientacaoPopup">Linhas de Orientação</label>
                <input type="text" name="linhasOrientacao" id="linhasOrientacaoPopup">

                <label for="quantidadeInstituicoesPopup">Quantidade de Instituições</label>
                <input type="number" name="quantidadeInstituicoes" id="quantidadeInstituicoesPopup">

                <label for="cursosAtuacaoPopup">Cursos de Atuação</label>
                <input type="text" name="cursosAtuacao" id="cursosAtuacaoPopup">

                <label for="quantidadeAlunosPopup">Quantidade de Alunos</label>
                <input type="number" name="quantidadeAlunos" id="quantidadeAlunosPopup">

                <label for="alunosOrientadosPopup">Alunos Orientados</label>
                <input type="text" name="alunosOrientados" id="alunosOrientadosPopup">

                <button type="button" id="cancelarButton">Cancelar</button>
                <button type="submit" id="atualizarButton">Atualizar</button>
            </form>
        </div>
    </div>

    <div id="footer-container">
        <p>© 2024 Gerenciador de TG</p>
    </div>

    <!-- Script para importar o header -->
    <script>
        // Função para carregar o conteúdo do header
        fetch('../components/header.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('header-container').innerHTML = data;
            })
            .catch(error => console.error('Erro ao carregar o header:', error));
    </script>

    <!-- Script do arquivo JS da página -->
    <script src="../assets/js/professores.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Trabalhos de Graduação</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.bundle.min.js"></script>
</head>

<body class="bg-light">

    <!-- Contêiner onde o header será carregado -->
    <div id="header-container" class="mb-4"></div>

    <div class="container">
        <h2 class="my-4 text-center">Cadastro de Trabalhos</h2>
        <form id="trabalhoForm" class="mb-5">
            <div class="form-group">
                <label for="tema">Tema</label>
                <input type="text" class="form-control" name="tema" id="tema" required>
            </div>
            <div class="form-group">
                <label for="objetivo">Objetivo</label>
                <input type="text" class="form-control" name="objetivo" id="objetivo" required>
            </div>
            <div class="form-group">
                <label for="questaoProblema">Questão Problema</label>
                <input type="text" class="form-control" name="questaoProblema" id="questaoProblema" required>
            </div>
            <div class="form-group">
                <label for="alunoOrientadoId">ID do Aluno Orientado</label>
                <input type="number" class="form-control" name="alunoOrientadoId" id="alunoOrientadoId" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Cadastrar</button>
        </form>

        <h3 class="mb-3">Lista de Trabalhos</h3>
        <div class="form-inline mb-3">
            <input type="text" id="filtro" class="form-control mr-2" placeholder="Filtrar por ID">
            <button id="buscar" class="btn btn-outline-primary mr-2">Buscar</button>
            <button id="limparBusca" class="btn btn-outline-secondary">Limpar Busca</button>
        </div>

        <table class="table table-striped" id="trabalhosTable">
            <thead class="thead-dark">
                <tr>
                    <th>ID</th>
                    <th>Tema</th>
                    <th>Objetivo</th>
                    <th>Questão Problema</th>
                    <th>ID do Aluno Orientado</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <!-- Popup de edição -->
    <div id="popup" class="modal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Editar Trabalho</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <form id="popupForm">
                    <div class="modal-body">
                        <div class="form-group">
                            <label for="idPopup">ID</label>
                            <input type="text" class="form-control" name="id" id="idPopup" disabled>
                        </div>
                        <div class="form-group">
                            <label for="temaPopup">Tema</label>
                            <input type="text" class="form-control" name="tema" id="temaPopup">
                        </div>
                        <div class="form-group">
                            <label for="objetivoPopup">Objetivo</label>
                            <input type="text" class="form-control" name="objetivo" id="objetivoPopup">
                        </div>
                        <div class="form-group">
                            <label for="questaoProblemaPopup">Questão Problema</label>
                            <input type="text" class="form-control" name="questaoProblema" id="questaoProblemaPopup">
                        </div>
                        <div class="form-group">
                            <label for="alunoOrientadoIdPopup">ID do Aluno Orientado</label>
                            <input type="number" class="form-control" name="alunoOrientadoId" id="alunoOrientadoIdPopup">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" id="cancelarButton" data-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary" id="atualizarButton">Atualizar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <footer class="text-center mt-4">
        <p>© 2024 Gerenciador de TG</p>
    </footer>

    <!-- Script para importar o header -->
    <script>
        fetch('../components/header.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('header-container').innerHTML = data;
            })
            .catch(error => console.error('Erro ao carregar o header:', error));
    </script>

    <script>
        // Funções para carregar e salvar os dados no cache
        const salvarNoCache = (trabalhos) => {
            localStorage.setItem('trabalhos', JSON.stringify(trabalhos));
        };

        const carregarDoCache = () => {
            const trabalhosCache = localStorage.getItem('trabalhos');
            return trabalhosCache ? JSON.parse(trabalhosCache) : [];
        };

        const limparCache = () => {
            localStorage.removeItem('trabalhos');
        };

        // Seletor de elementos
        const trabalhoForm = document.getElementById('trabalhoForm');
        const trabalhosTable = document.getElementById('trabalhosTable').querySelector('tbody');
        const filtroInput = document.getElementById('filtro');
        const buscarButton = document.getElementById('buscar');
        const limparBuscaButton = document.getElementById('limparBusca');
        const popup = document.getElementById('popup');
        const popupForm = document.getElementById('popupForm');
        const cancelarButton = document.getElementById('cancelarButton');
        const atualizarButton = document.getElementById('atualizarButton');

        // Função para criar uma linha na tabela
        function adicionarLinha(trabalho) {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${trabalho.id}</td>
                <td>${trabalho.tema}</td>
                <td>${trabalho.objetivo}</td>
                <td>${trabalho.questaoProblema}</td>
                <td>${trabalho.alunoOrientadoId}</td>
                <td>
                    <button onclick="editarTrabalho('${trabalho.id}')">Editar</button>
                    <button onclick="deletarTrabalho('${trabalho.id}')">Deletar</button>
                </td>
            `;
            trabalhosTable.appendChild(row);
        }

        // Atualizar tabela com lista de trabalhos
        function atualizarTabela() {
            const trabalhos = carregarDoCache();
            trabalhosTable.innerHTML = '';
            trabalhos.forEach(adicionarLinha);
        }

        // Submeter formulário de cadastro
        trabalhoForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const formData = new FormData(trabalhoForm);

            const novoTrabalho = {
                id: Date.now(), // Gerar um ID único com base no timestamp
                tema: formData.get('tema'),
                objetivo: formData.get('objetivo'),
                questaoProblema: formData.get('questaoProblema'),
                alunoOrientadoId: Number(formData.get('alunoOrientadoId')),
            };

            const trabalhos = carregarDoCache();
            trabalhos.push(novoTrabalho);
            salvarNoCache(trabalhos);
            trabalhoForm.reset();
            atualizarTabela();
        });

        // Editar trabalho
        function editarTrabalho(id) {
            const trabalhos = carregarDoCache();
            const trabalho = trabalhos.find(t => t.id == id);
            if (trabalho) {
                document.getElementById('idPopup').value = trabalho.id;
                document.getElementById('temaPopup').value = trabalho.tema;
                document.getElementById('objetivoPopup').value = trabalho.objetivo;
                document.getElementById('questaoProblemaPopup').value = trabalho.questaoProblema;
                document.getElementById('alunoOrientadoIdPopup').value = trabalho.alunoOrientadoId;

                $('#popup').modal('show'); // Usando o Bootstrap para exibir o modal

                atualizarButton.onclick = function () {
                    trabalho.tema = document.getElementById('temaPopup').value;
                    trabalho.objetivo = document.getElementById('objetivoPopup').value;
                    trabalho.questaoProblema = document.getElementById('questaoProblemaPopup').value;
                    trabalho.alunoOrientadoId = document.getElementById('alunoOrientadoIdPopup').value;
                    
                    salvarNoCache(trabalhos);
                    $('#popup').modal('hide');
                    atualizarTabela();
                };
            }
        }

        // Deletar trabalho
        function deletarTrabalho(id) {
            const trabalhos = carregarDoCache();
            const index = trabalhos.findIndex(t => t.id == id);
            if (index !== -1) {
                trabalhos.splice(index, 1);
                salvarNoCache(trabalhos);
                atualizarTabela();
            }
        }

        // Filtro de busca
        buscarButton.addEventListener('click', () => {
            const filtro = filtroInput.value;
            const trabalhos = carregarDoCache();
            const resultados = trabalhos.filter(t => t.id.toString().includes(filtro));
            trabalhosTable.innerHTML = '';
            resultados.forEach(adicionarLinha);
        });

        limparBuscaButton.addEventListener('click', () => {
            filtroInput.value = '';
            atualizarTabela();
        });

        // Inicializa a tabela com os dados armazenados
        atualizarTabela();

    </script>
</body>

</html>
